<title>Resale Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: slim sidebar and one wide working column; tab bar on phones. Charcoal ground, hairline gold, channel colors only inside charts and pills. */
:root{
  color-scheme:dark;
  --bg:#0a0a0b;
  --surface:#121214;
  --raised:#18181b;
  --field:#1c1c20;
  --hover:#222227;
  --line:#26262b;
  --line-soft:#1d1d21;
  --line-strong:#34343b;
  --ink:#f0efec;
  --ink-2:#c3c2b7;
  --ink-3:#898781;
  --gold:#c9a45c;
  --gold-hi:#e2c27d;
  --gold-wash:rgba(201,164,92,.12);
  --gold-line:rgba(201,164,92,.34);
  --good:#34b45a;
  --bad:#e66767;
  --warn:#fab219;
  --ch-ebay:#3987e5;
  --ch-amazon:#d95926;
  --ch-facebook:#9085e9;
  --ch-local:#199e70;
  --rev:#6b7488;
  --font-display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --font-ui:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:radial-gradient(1100px 520px at 12% -8%,rgba(201,164,92,.075),transparent 62%);
  background-repeat:no-repeat;
  color:var(--ink);
  font:400 14px/1.5 var(--font-ui);
  padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}

.app{display:grid;grid-template-columns:216px minmax(0,1fr);gap:40px;max-width:1360px;margin:0 auto}
.side{position:sticky;top:28px;align-self:start;display:flex;flex-direction:column;gap:30px;min-width:0}
.brand{display:flex;gap:12px;align-items:center}
.brand svg{width:36px;height:36px;flex:none}
.brand b{display:block;font:400 23px/1 var(--font-display);letter-spacing:.01em}
.brand small{display:block;color:var(--ink-3);font-size:12px;margin-top:4px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border:0;border-radius:8px;background:none;color:var(--ink-2);font-weight:600;font-size:13.5px;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--raised);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--gold-wash);color:var(--gold-hi)}
.nav svg,.tabbar svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.side-foot{color:var(--ink-3);font-size:12px;display:flex;flex-direction:column;gap:6px}
.status{display:flex;align-items:center;gap:8px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.status.local i{background:var(--warn)}

.main{min-width:0}
.mbrand{display:none;align-items:center;gap:10px;margin-bottom:14px;font:400 20px/1 var(--font-display)}
.mbrand svg{width:28px;height:28px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font:400 40px/1.05 var(--font-display);letter-spacing:-.005em;text-wrap:balance}
.top p{color:var(--ink-3);margin-top:6px}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--hover);border-color:#44444d}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#1a1306}
.btn-gold:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.btn-sm{height:30px;padding:0 11px;font-size:12.5px}
.btn-ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--raised);border-color:transparent;color:var(--ink)}
.btn.danger{color:var(--bad);border-color:rgba(230,103,103,.35)}
.btn.danger:hover{background:rgba(230,103,103,.1)}
.btn.confirm{background:var(--bad);border-color:var(--bad);color:#1a0606}
.btn-icon{width:34px;height:34px;padding:0;border:0;border-radius:8px;background:none;color:var(--ink-2);font-size:22px;line-height:1}
.btn-icon:hover{background:var(--raised);color:var(--ink)}

.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 12px;border:0;border-radius:7px;background:none;color:var(--ink-2);font-weight:600;font-size:12.5px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--gold-wash);color:var(--gold-hi)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 16px;flex-wrap:wrap;margin-bottom:16px}
.panel h2{font:400 24px/1.1 var(--font-display)}
.sub{color:var(--ink-3);font-size:12.5px}
.eyebrow{color:var(--ink-3);font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}
.stack{display:flex;flex-direction:column;gap:20px}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px}
.cols-even{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}

.banner{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:10px 14px;margin-bottom:18px;border:1px solid var(--gold-line);background:var(--gold-wash);border-radius:10px}
.banner span{color:var(--ink)}

.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);border:1px solid var(--gold-line);border-radius:14px;background:linear-gradient(120deg,rgba(201,164,92,.12),rgba(201,164,92,0) 52%),var(--surface);overflow:hidden}
.hero-main{padding:28px 30px;display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:0}
.hero-val{font:800 clamp(44px,6vw,66px)/1 var(--font-ui);letter-spacing:-.035em;color:var(--gold-hi);overflow-wrap:anywhere}
.hero-val.neg{color:var(--bad)}
.delta{display:inline-flex;gap:7px;align-items:center;font-weight:600;font-size:13px;flex-wrap:wrap}
.delta.up{color:var(--good)}
.delta.down{color:var(--bad)}
.delta.flat{color:var(--ink-3)}
.delta em{font-style:normal;color:var(--ink-3);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-left:1px solid var(--line)}
.stat{background:var(--surface);padding:20px 22px;min-width:0;display:flex;flex-direction:column;gap:5px}
.stat .v{font-size:23px;font-weight:700;letter-spacing:-.015em;overflow-wrap:anywhere}
.stat .s{color:var(--ink-3);font-size:12px}

.chart{position:relative;width:100%;min-height:120px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--line);stroke-width:1}
.base{stroke:var(--line-strong);stroke-width:1}
.ax{fill:var(--ink-3);font:500 11px var(--font-ui)}
.b-pos,.b-net{fill:var(--gold)}
.b-neg{fill:var(--bad)}
.b-rev{fill:var(--rev)}
.hot{filter:brightness(1.3)}
.hit{fill:transparent;outline:none}
.hit:focus-visible{fill:rgba(201,164,92,.09)}
.tip{position:absolute;}

/* Added Backup UI Style */
.backup-section {
  display: flex;
  gap: 10px;
  padding: 10px;
  background: var(--surface);
  border: 1px dashed var(--line-strong);
  border-radius: 8px;
  margin-top: 15px;
}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar Panel -->
  <div class="side">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      <div>
        <b>Resale Ledger</b>
        <small>Standalone Tool</small>
      </div>
    </div>
    
    <div class="nav">
      <button aria-current="page">Dashboard</button>
    </div>

    <!-- Account-Free Backup Box -->
    <div class="backup-section">
      <button class="btn btn-sm btn-gold" onclick="exportData()">Backup Ledger</button>
      <button class="btn btn-sm" onclick="document.getElementById('importFile').click()">Load Backup</button>
      <input type="file" id="importFile" style="display:none" onchange="importData(this)">
    </div>

    <div class="side-foot">
      <div class="status"><i></i> Ledger Status Active</div>
    </div>
  </div>

  <!-- Primary Working Area -->
  <div class="main">
    <div class="top">
      <div>
        <h1>Profit Dashboard</h1>
        <p>Your ongoing resell stats and metrics ledger balance.</p>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Performance Overview</h2>
      </div>
      <div class="hero">
        <div class="hero-main">
          <span class="eyebrow">Net Balance</span>
          <div class="hero-val" id="netValue">$0.00</div>
        </div>
        <div class="stats">
          <div class="stat">
            <span class="s">Total Revenue</span>
